<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYC test: face</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Face check</h1>
  <p class="lead" id="lead">Your camera is checked first for lighting and sharpness. Then follow the prompts: the circle only fills once the camera sees you move.</p>

  <!-- Stage 1: camera, then the frozen shot while the answer loads -->
  <section id="stage-capture">
    <div class="stage">
      <div>
        <div class="camera" id="camera">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="freeze" hidden></canvas>
          <svg class="ring" viewBox="0 0 100 100">
            <circle class="ring-track" cx="50" cy="50" r="47"></circle>
            <circle id="ring-progress" class="ring-progress" cx="50" cy="50" r="47"></circle>
          </svg>
          <div id="spinner" class="spinner" hidden></div>
          <div id="prompt" class="prompt">Press start</div>
        </div>

        <div id="hint" class="hint"></div>
        <div id="readings" class="readings"></div>

        <div class="controls">
          <button id="start">Start</button>
        </div>
      </div>

      <aside>
        <h2>Document on file</h2>
        <img id="document-face" alt="" hidden>
        <dl id="document-fields"></dl>
      </aside>
    </div>
  </section>

  <!-- Stage 2: the result, in the place the camera was -->
  <section id="stage-result" hidden>
    <div id="verdict" class="verdict"></div>

    <div class="stage">
      <div class="photos">
        <figure><img id="captured" alt=""><figcaption>Captured now</figcaption></figure>
        <figure><img id="document-face-2" alt="" hidden><figcaption>On the document</figcaption></figure>
      </div>
      <aside>
        <h2>Scores</h2>
        <dl id="scores"></dl>
      </aside>
    </div>

    <button id="again">Try again</button>
    <details><summary>Head pose per frame</summary><pre id="poses"></pre></details>
    <details><summary>Full response</summary><pre id="json"></pre></details>
  </section>

  <div id="status" class="status"></div>
</main>

<script>
const verificationId = location.pathname.split('/').pop();
const video = document.getElementById('video');
const freeze = document.getElementById('freeze');
const camera = document.getElementById('camera');
const prompt = document.getElementById('prompt');
const hint = document.getElementById('hint');
const readings = document.getElementById('readings');
const spinner = document.getElementById('spinner');
const status = document.getElementById('status');
const ring = document.getElementById('ring-progress');
const stageCapture = document.getElementById('stage-capture');
const stageResult = document.getElementById('stage-result');
const RING = 2 * Math.PI * 47;
ring.style.strokeDasharray = RING;
ring.style.strokeDashoffset = RING;

const STEPS = {
  full: ['up', 'down', 'left', 'right'],
  turns: ['left', 'right'],
};
const INSTRUCTION = {
  up: 'Tilt your head up',
  down: 'Tilt your head down',
  // Measured from real captures: negative yaw is the person turning to their own
  // left. The preview is mirrored like a mirror, so the prompt names their side,
  // not the screen's.
  left: 'Slowly turn your head to your left',
  right: 'Slowly turn your head to your right',
  centre: 'Look straight at the camera',
};
// What the server reports about the frame, in words the person can act on.
const HINTS = {
  NO_FACE: 'Position your face inside the circle',
  MULTIPLE_FACES: 'Make sure you are the only person in view',
  MOVE_CLOSER: 'Move closer to the camera',
  MOVE_BACK: 'Move slightly further from the camera',
  OFF_CENTRE: 'Centre your face in the circle',
  TOO_DARK: 'Move to a brighter area or turn on a light',
  TOO_BRIGHT: 'Too much light: move away from the window or lamp behind you',
  UNEVEN_LIGHTING: 'Light is coming from one side: face the light source',
  HOLD_STILL: 'Hold your device steady',
  FRAME_UNREADABLE: 'The camera image could not be read',
};
const WORDING = { pass: 'Verified', review: 'Needs a closer look', fail: 'Not verified', retake: 'Please try again' };

const TURN_TARGET = 18;   // degrees, matches TURN_DEGREES on the server
const NOD_TARGET = 12;    // matches NOD_DEGREES
const READY_FRAMES = 3;         // consecutive good frames before capture begins
const READY_TIMEOUT_MS = 12000; // then start anyway: guidance must never trap anyone
const CALIBRATION_FRAMES = 4;
const HOLD_CENTRE_FRAMES = 3;
const STEP_TIMEOUT_MS = 25000;
const PROBE_GAP_MS = 0;     // sample as fast as the round trip allows

let baseline = null;
let kept = [];
let claimed = [];   // {index, step}: which frame the guidance accepted for which step
let cancelled = false;

async function loadSession() {
  const response = await fetch(`/api/session/${verificationId}`);
  if (!response.ok) {
    status.textContent = 'This verification has expired. Scan a document again.';
    document.getElementById('start').disabled = true;
    return;
  }
  const session = await response.json();
  if (session.document_face) {
    for (const id of ['document-face', 'document-face-2']) {
      const image = document.getElementById(id);
      image.src = 'data:image/jpeg;base64,' + session.document_face;
      image.hidden = false;
    }
  }
  const fields = document.getElementById('document-fields');
  const shown = { document_type: session.document_type, decision: session.document_decision, ...session.fields };
  for (const [key, value] of Object.entries(shown)) {
    if (value === null || value === undefined || value === '') continue;
    fields.insertAdjacentHTML('beforeend', `<dt>${key.replaceAll('_', ' ')}</dt><dd>${value}</dd>`);
  }
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1280 } },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
}

function drawSquare(canvas) {
  const size = Math.min(video.videoWidth, video.videoHeight);
  canvas.width = 720;   // detail matters for the face match; grain costs score
  canvas.height = 720;
  canvas.getContext('2d').drawImage(
    video,
    (video.videoWidth - size) / 2, (video.videoHeight - size) / 2, size, size,
    0, 0, canvas.width, canvas.height,
  );
}

function grabFrame() {
  const canvas = document.createElement('canvas');
  drawSquare(canvas);
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.95));
}

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/** Send one frame for live feedback: is it usable, and which way is the head pointing? */
async function probe(blob, calibrate = false) {
  const data = new FormData();
  data.append('frame', blob, 'frame.jpg');
  data.append('verification_id', verificationId);
  if (calibrate) data.append('calibrate', 'true');
  const response = await fetch('/v1/face/frame', { method: 'POST', body: data });
  return response.json();
}

function showReadings(r) {
  const bits = [];
  if (r.face_ratio != null) bits.push(`face ${Math.round(r.face_ratio * 100)}%`);
  if (r.brightness != null) bits.push(`light ${Math.round(r.brightness)}`);
  if (r.blur_score != null) bits.push(`sharp ${Math.round(r.blur_score)}`);
  if (r.uniformity != null) bits.push(`even ${r.uniformity}`);
  if (r.yaw != null) bits.push(`yaw ${Math.round(r.yaw)}\u00b0`);
  if (r.pitch != null) bits.push(`pitch ${Math.round(r.pitch)}\u00b0`);
  readings.textContent = bits.join(' \u00b7 ');
}

function showHint(probeResult, target) {
  const problem = (probeResult.hints || [])[0];
  let message = problem ? (HINTS[problem] || problem) : '';

  // Show how far the head has actually turned, so the movement is visible while
  // it is happening rather than the circle just sitting there.
  if (!message && baseline && probeResult.yaw !== null && probeResult.yaw !== undefined) {
    const turned = Math.round(probeResult.yaw - baseline.yaw);
    const nodding = target === 'up' || target === 'down';
    const moved = nodding ? Math.round(probeResult.pitch ?? 0) : turned;
    const needed = nodding ? NOD_TARGET : TURN_TARGET;
    message = target && target !== 'centre'
      ? `${Math.abs(moved)}° of ${needed}° needed`
      : `${Math.abs(turned)}° from centre`;
  }
  hint.textContent = message;
  hint.className = 'hint' + (problem ? ' warn' : '');
  showReadings(probeResult);
  camera.classList.toggle('ok', !!probeResult.usable);
}

/** Keep sending frames until `accept` says this one will do, or we run out of patience. */
async function waitFor(accept, { timeout = STEP_TIMEOUT_MS, target = null, calibrate = false } = {}) {
  const deadline = Date.now() + timeout;
  const nudgeAt = Date.now() + 6000;
  while (!cancelled && Date.now() < deadline) {
    const blob = await grabFrame();
    let result;
    try {
      result = await probe(blob, calibrate);
    } catch (error) {
      status.textContent = 'Live check failed: ' + error;
      return null;
    }
    showHint(result, target);
    if (Date.now() > nudgeAt && target && !hint.classList.contains('warn')) {
      hint.textContent = `Still waiting: ${INSTRUCTION[target].toLowerCase()}`;
    }
    if (result.usable && accept(result)) return { blob, result };
    await wait(PROBE_GAP_MS);
  }
  return null;
}

function setProgress(done, total) {
  ring.style.strokeDashoffset = RING * (1 - done / total);
}

async function run() {
  const challenge = 'full';
  const directions = STEPS[challenge];
  const total = 1 + directions.length + 1;   // calibration, each direction, the final hold
  let done = 0;

  cancelled = false;
  baseline = null;
  kept = [];
  claimed = [];
  document.getElementById('start').disabled = true;
  showCaptureStage();
  status.textContent = '';

  // 0. Check the camera and the room before asking anyone to move: lighting,
  //    sharpness, framing and distance must all be right first.
  prompt.textContent = 'Checking your camera';
  if (!await waitUntilReady()) {
    status.textContent = 'Starting anyway: the camera view is not ideal, so this may need a retry.';
  }

  // 1. Learn this person's resting pose (kept on the server, with the document).
  prompt.textContent = INSTRUCTION.centre;
  for (let i = 0; i < CALIBRATION_FRAMES; i++) {
    const step = await waitFor(() => true, { timeout: 40000, calibrate: true });
    if (!step) return giveUp('We could not see your face clearly. Check your lighting and try again.');
    kept.push(step.blob);
  }
  baseline = { yaw: 0, pitch: 0 };
  setProgress(++done, total);

  // 2. One direction at a time. The ring waits until that movement is actually seen.
  for (const step of directions) {
    prompt.textContent = INSTRUCTION[step];
    const accept = (result) => result.direction === step;
    const got = await waitFor(accept, { target: step });
    if (!got) return giveUp(`We did not see that. Try again, a little slower: ${INSTRUCTION[step].toLowerCase()}.`);
    // Keep a second frame straight after: the server needs to see the movement
    // held, and one frame per step could never satisfy that.
    claimed.push({ index: kept.length, step });
    kept.push(got.blob, await grabFrame());
    setProgress(++done, total);
  }

  // 3. Back to centre for the photo we keep.
  prompt.textContent = INSTRUCTION.centre;
  for (let i = 0; i < HOLD_CENTRE_FRAMES; i++) {
    const step = await waitFor((result) => result.direction === 'centre');
    if (!step) return giveUp('Look straight at the camera to finish.');
    kept.push(step.blob);
  }
  setProgress(++done, total);

  await submit(challenge);
}

/** Hold the capture until the camera view is good enough, several frames running. */
async function waitUntilReady() {
  const deadline = Date.now() + READY_TIMEOUT_MS;
  let good = 0;
  while (!cancelled && Date.now() < deadline) {
    const blob = await grabFrame();
    let result;
    try {
      result = await probe(blob, calibrate);
    } catch (error) {
      status.textContent = 'Live check failed: ' + error;
      return false;
    }
    showHint(result);
    good = result.usable ? good + 1 : 0;
    if (good === 1 && !result.hints.length) hint.textContent = 'Hold it there';
    if (good >= READY_FRAMES) return true;
    await wait(PROBE_GAP_MS);
  }
  return false;
}

function median(values) {
  const sorted = [...values].sort((a, b) => a - b);
  return sorted[Math.floor(sorted.length / 2)];
}

function giveUp(message) {
  status.textContent = message;
  hint.textContent = '';
  prompt.textContent = 'Press start';
  document.getElementById('start').disabled = false;
}

async function submit(challenge) {
  // Freeze on the last shot while the answer comes back, the way a photo booth does.
  drawSquare(freeze);
  freeze.hidden = false;
  video.hidden = true;
  spinner.hidden = false;
  hint.textContent = '';
  prompt.textContent = 'Checking your identity';

  const data = new FormData();
  kept.forEach((blob, index) => data.append('frames', blob, `frame_${index}.jpg`));
  data.append('challenge', challenge);
  // Which frame was captured for which step. The server measures each of these
  // frames itself, so this cannot be used to claim a movement that never
  // happened; it only says where to look, instead of hoping the movement was
  // still being held when the next frame arrived.
  data.append('steps', JSON.stringify(claimed));

  try {
    const response = await fetch(`/v1/verifications/${verificationId}/face`, { method: 'POST', body: data });
    show(await response.json(), response.ok);
  } catch (error) {
    status.textContent = 'Request failed: ' + error;
    showCaptureStage();
    document.getElementById('start').disabled = false;
  } finally {
    spinner.hidden = true;
  }
}

function showCaptureStage() {
  stageResult.hidden = true;
  stageCapture.hidden = false;
  freeze.hidden = true;
  video.hidden = false;
  spinner.hidden = true;
  hint.textContent = '';
  camera.classList.remove('ok');
  ring.style.strokeDashoffset = RING;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function show(body, ok) {
  status.textContent = '';
  document.getElementById('json').textContent = JSON.stringify(body, null, 2);
  if (!ok) {
    status.textContent = body.detail || 'Request rejected';
    showCaptureStage();
    document.getElementById('start').disabled = false;
    return;
  }

  // The result takes the camera's place, so it is the first thing on screen.
  const capture = body.liveness.capture;
  document.getElementById('captured').src = capture
    ? 'data:image/jpeg;base64,' + capture.image_base64
    : freeze.toDataURL('image/jpeg');

  const verdict = document.getElementById('verdict');
  verdict.className = 'verdict ' + body.decision;
  verdict.innerHTML = `<strong>${WORDING[body.decision] || body.decision}</strong>` +
    (body.reasons.length ? `<span>${body.reasons.join(', ')}</span>` : '') +
    (body.warnings.length ? `<span class="muted">${body.warnings.join(', ')}</span>` : '');

  const challenge = body.liveness.challenge;
  document.getElementById('scores').innerHTML = `
    <dt>match score</dt><dd>${body.match.score ?? '-'} (pass at ${body.match.threshold})</dd>
    <dt>best frame</dt><dd>${body.match.best_score ?? '-'}</dd>
    <dt>frames compared</dt><dd>${body.match.frames_compared}</dd>
    <dt>directions</dt><dd>${challenge.completed.join(', ') || 'none'}${challenge.missing.length ? ' · missing ' + challenge.missing.join(', ') : ''}</dd>
    <dt>faces found</dt><dd>${body.liveness.frames_with_face} of ${body.liveness.frames_received}</dd>
    <dt>depth (planarity)</dt><dd>${body.liveness.planarity ?? '-'}% (a flat photo scores under 1.2)</dd>
    <dt>time</dt><dd>${body.processing_ms} ms</dd>`;

  document.getElementById('poses').textContent = body.liveness.poses
    .map((pose) => `frame ${String(pose.index).padStart(2)}  faces=${pose.faces}  yaw=${pose.yaw ?? '-'}  pitch=${pose.pitch ?? '-'}  ${pose.direction ?? ''}`)
    .join('\n');

  document.getElementById('lead').textContent = 'Result of the check just completed.';
  stageCapture.hidden = true;
  stageResult.hidden = false;
  document.getElementById('start').disabled = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('start').addEventListener('click', async () => {
  try {
    if (!video.srcObject) await startCamera();
    await run();
  } catch (error) {
    status.textContent = 'Camera unavailable: ' + error;
    document.getElementById('start').disabled = false;
  }
});
document.getElementById('again').addEventListener('click', async () => {
  document.getElementById('lead').textContent = 'Follow the prompts. The circle only fills once the camera sees you actually move.';
  showCaptureStage();
  await run();
});

loadSession();
</script>
</body>
</html>
